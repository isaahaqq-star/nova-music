name = "nova-music-backend"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# R2 Buckets
[[r2_buckets]]
binding = "NOVA_AUDIO"
bucket_name = "nova-music-audio"

[[r2_buckets]]
binding = "NOVA_MASTERS"
bucket_name = "nova-music-masters"

# Environment variables
[env.production]
vars = { ENVIRONMENT = "production" }

[env.staging]
vars = { ENVIRONMENT = "staging" }

# Routes
[[routes]]
pattern = "audio.nova-music.dev/*"
zone_name = "nova-music.dev"

# CORS configuration
routes.custom_domain = true
